[project]
name = "analisis-operativo-servicio-al-cliente"
version = "0.1.0"
description = "App web de análisis operativo de servicio al cliente (Contact Center)"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
