<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Análisis Operativo - Servicio al Cliente{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }

        /* Barra de navegación */
        nav {
            background: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
        }

        .logo:hover {
            color: #7dd3fc;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* Contenido principal */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Tarjetas/paneles */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .card h2 {
            color: #38bdf8;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .card h3 {
            color: #cbd5e1;
            margin-bottom: 0.75rem;
            font-size: 1.25rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 1rem;
        }

        /* Formularios */
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 600px;
        }

        label {
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="file"],
        input[type="text"],
        input[type="submit"],
        button {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            transition: all 0.2s;
            font-family: inherit;
        }

        input[type="file"]:focus,
        input[type="text"]:focus,
        button:focus {
            outline: none;
            border-color: #38bdf8;
            ring: 2px solid #38bdf8;
        }

        input[type="submit"],
        button[type="submit"],
        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }

        input[type="submit"]:hover,
        button[type="submit"]:hover,
        .btn-primary:hover {
            background: #7dd3fc;
        }

        input[type="submit"]:disabled,
        button[type="submit"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Mensajes de estado */
        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .alert-info {
            background: #1e3a5f;
            border: 1px solid #3b82f6;
            color: #bfdbfe;
        }

        .alert-warning {
            background: #451a03;
            border: 1px solid #f59e0b;
            color: #fcd34d;
        }

        .alert-error {
            background: #450a0a;
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        /* Bloque de contenido */
        .content-block {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tabla simple */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.9rem;
        }

        tr:hover {
            background: #334155;
        }

        /* Footer */
        footer {
            background: #0f172a;
            border-top: 1px solid #334155;
            padding: 2rem;
            margin-top: 2rem;
            color: #64748b;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            nav {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .nav-links {
                flex-direction: column;
                gap: 0.5rem;
                width: 100%;
            }

            .nav-links a {
                display: block;
                padding: 0.5rem 0;
                border-bottom: 1px solid #334155;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">Análisis Operativo</a>
        <div class="nav-links">
            <a href="/">Inicio</a>
            <a href="/exportar_informe">Descargar Informe</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>App de Análisis Operativo - Contact Center | Servicio al Cliente</p>
        <p>Generado exclusivamente con datos de los archivos de insumos. No se inventan valores.</p>
    </footer>
</body>
</html>
